<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover ให้แสดงเต็มจอบนมือถือ -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>OT TRACKER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- ===== แถบบน: ชื่อเว็บ + ปุ่มตั้งค่า ===== -->
    <header class="topbar">
      <h1>OT TRACKER</h1>
      <button id="btn-settings" class="icon-btn" type="button" aria-label="ตั้งค่า">⚙️</button>
    </header>

    <!-- ===== หน้าแรก: ถามว่าวันนี้ทำ OT ไหม ===== -->
    <section class="card today">
      <p class="today-month" id="today-month"></p>
      <p class="today-date" id="today-date"></p>
      <h2 class="question">วันนี้ทำ OT ไหม?</h2>

      <div class="big-buttons">
        <button id="btn-ot" class="big-btn ot" type="button">✅ ทำ OT</button>
        <button id="btn-no" class="big-btn no" type="button">❌ ไม่ทำ</button>
      </div>

      <!-- ข้อความยืนยัน / สถานะของวันนี้ -->
      <p id="today-status" class="today-status" aria-live="polite"></p>
    </section>

    <!-- ===== สรุปประจำเดือน (ตามเดือนที่เปิดอยู่ในปฏิทิน) ===== -->
    <section class="card">
      <div class="cal-head">
        <button id="sum-prev" class="icon-btn" type="button" aria-label="รอบก่อนหน้า">‹</button>
        <div class="sum-title">
          <h2 class="section-title" id="summary-title">สรุปรอบเงิน</h2>
          <p class="sum-range" id="summary-range"></p>
        </div>
        <button id="sum-next" class="icon-btn" type="button" aria-label="รอบถัดไป">›</button>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-value" id="stat-days">0</span>
          <span class="stat-label">วันที่ทำ OT</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-hours">0</span>
          <span class="stat-label">ชั่วโมงรวม</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-money">0</span>
          <span class="stat-label">เงิน OT (บาท)</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-no">0</span>
          <span class="stat-label">วันที่ไม่ทำ OT</span>
        </div>
      </div>
    </section>

    <!-- ===== ปฏิทินรายเดือน ===== -->
    <section class="card">
      <div class="cal-head">
        <button id="cal-prev" class="icon-btn" type="button" aria-label="เดือนก่อนหน้า">‹</button>
        <h2 class="section-title" id="cal-title"></h2>
        <button id="cal-next" class="icon-btn" type="button" aria-label="เดือนถัดไป">›</button>
      </div>
      <div class="cal-weekdays" aria-hidden="true">
        <span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <p class="hint">แตะที่วันในปฏิทินเพื่อเพิ่มหรือแก้ไข</p>
    </section>

    <!-- ===== ประวัติ ===== -->
    <section class="card">
      <h2 class="section-title">ประวัติ</h2>
      <ul class="history" id="history"></ul>
    </section>

  </main>

  <!-- ===== หน้าต่างแก้ไขรายการ ===== -->
  <div class="modal" id="modal-edit" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edit-title">
      <h2 id="edit-title">แก้ไข</h2>

      <div class="segmented">
        <button type="button" id="seg-ot" class="seg ot">✅ ทำ OT</button>
        <button type="button" id="seg-no" class="seg no">❌ ไม่ทำ</button>
      </div>

      <div class="sheet-actions">
        <button type="button" id="edit-delete" class="btn danger">ลบ</button>
        <button type="button" id="edit-cancel" class="btn">ยกเลิก</button>
        <button type="button" id="edit-save" class="btn primary">บันทึก</button>
      </div>
    </div>
  </div>

  <!-- ===== หน้าต่างตั้งค่า ===== -->
  <div class="modal" id="modal-settings" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title">ตั้งค่า</h2>

      <label class="field">
        <span>เงิน OT ต่อวัน (ทำ 3 ชม.) — บาท</span>
        <input id="setting-pay" type="number" inputmode="decimal" min="0" step="1">
      </label>

      <label class="field">
        <span>รอบเงินเริ่มวันที่</span>
        <select id="setting-start"></select>
        <small class="note" id="setting-cycle-note"></small>
      </label>

      <div class="sheet-actions">
        <button type="button" id="settings-cancel" class="btn">ยกเลิก</button>
        <button type="button" id="settings-save" class="btn primary">บันทึก</button>
      </div>
    </div>
  </div>

  <!-- ===== หน้าต่างยืนยันการลบ (ใช้แทน confirm() ที่บางหน้าจอไม่ทำงาน) ===== -->
  <div class="modal" id="modal-confirm" hidden>
    <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="confirm-text">
      <h2 id="confirm-text">ลบรายการนี้?</h2>
      <div class="sheet-actions">
        <button type="button" id="confirm-no" class="btn">ยกเลิก</button>
        <button type="button" id="confirm-yes" class="btn danger-fill">ลบ</button>
      </div>
    </div>
  </div>

  <!-- ข้อความ "บันทึกแล้ว ✓" -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
